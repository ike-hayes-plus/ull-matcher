name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Maven wrapper availability
        run: ./mvnw -version

      - name: Run benchmark tooling self-tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./scripts/ops/test-python-scripts.sh
          ./scripts/ops/test-deploy-cluster.sh
          ./scripts/ops/test-benchmark-replication-metrics.sh
          ./scripts/ops/test-archive-current-benchmarks.sh
          ./scripts/ops/test-validate-benchmark-baseline.sh
          ./scripts/ops/test-check-ha-benchmark-floor.sh
          # Do not run the 3.0-full matrix on CI (needs dedicated lab hardware).
          # Validate the published table shape; compare numbers only when reports exist.
          ./scripts/ops/validate-benchmark-baseline.py --skip-missing-reports

      # Full verify: style checks, every module's tests, and the JaCoCo
      # line/branch gates defined in the parent pom.
      - name: Build, test and enforce coverage gates
        run: ./mvnw --batch-mode --no-transfer-progress -Pstyle-check verify

      - name: Run chaos tests
        run: ./mvnw --batch-mode --no-transfer-progress -Pchaos-tests test

      - name: Build server distribution artifact
        if: matrix.os == 'ubuntu-latest'
        run: ./mvnw --batch-mode --no-transfer-progress -pl matcher-server-dist -am package -DskipTests

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.os }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/**'
          if-no-files-found: ignore

  mutation:
    name: mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Line coverage proves code ran; mutation score proves the assertions
      # actually constrain behaviour. Gated on the matching engine only.
      - name: Run PIT on the matching engine
        run: ./mvnw --batch-mode --no-transfer-progress -Pmutation -pl matcher-core,matcher-runtime -am verify -DskipTests=false

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pit-reports
          path: '**/target/pit-reports/**'
          if-no-files-found: ignore

  benchmark-regression:
    name: benchmark regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Floors are an order of magnitude below the published baseline: shared
      # runners are too noisy for drift detection. This catches a collapse,
      # e.g. a lock or an allocation landing on the matching hot path.
      - name: Run no-cluster benchmarks against the CI floor
        run: ./scripts/ops/run-benchmark-regression.sh

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-regression-reports
          path: target/benchmark-regression/*.json
          if-no-files-found: ignore

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Generate CycloneDX SBOM
        run: ./mvnw --batch-mode --no-transfer-progress -Psbom package -DskipTests

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: '**/target/bom.*'
          if-no-files-found: error

      - name: Restore dependency-check database cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ github.run_id }}
          restore-keys: dependency-check-

      - name: Scan dependencies for known vulnerabilities
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw --batch-mode --no-transfer-progress -Pdependency-check verify -DskipTests

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: '**/target/dependency-check-report.*'
          if-no-files-found: ignore

  ha-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Start HA lab infrastructure
        run: ./scripts/run-chaos-tests.sh lab up

      - name: Start three-node cluster
        run: ./scripts/run-chaos-tests.sh cluster up

      - name: Validate transport rollout baseline
        run: ./scripts/run-chaos-tests.sh cluster validate

      - name: Run failover smoke
        run: ./scripts/run-chaos-tests.sh cluster failover-smoke

      - name: Stop cluster and lab
        if: always()
        run: |
          ./scripts/run-chaos-tests.sh cluster down || true
          ./scripts/run-chaos-tests.sh lab down || true

      - name: Upload HA smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ha-smoke-artifacts
          path: |
            target/chaos-lab/**
            target/failover-smoke/**
            target/lab-logs/**
            target/transport-compare/**
          if-no-files-found: ignore

  transport-compare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: ha-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Start HA lab infrastructure
        run: ./scripts/run-chaos-tests.sh lab up

      - name: Run transport comparison
        run: ./scripts/run-chaos-tests.sh cluster transport-compare

      - name: Stop cluster and lab
        if: always()
        run: |
          ./scripts/run-chaos-tests.sh cluster down || true
          ./scripts/run-chaos-tests.sh lab down || true

      - name: Upload transport comparison artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transport-compare-artifacts
          path: |
            target/transport-compare/**
            target/lab-logs/**
          if-no-files-found: ignore
